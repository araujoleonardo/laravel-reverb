services:
    api:
        build:
            context: ./
            dockerfile: ./docker/Dockerfile
        image: araujoleonardo/api-version
        container_name: api
        restart: unless-stopped
        working_dir: /var/www
        ports:
            - "8080:8080"
        volumes:
            - .:/var/www
        depends_on:
            - redis
        networks:
            - laravel

    nginx:
        image: nginx:stable-alpine
        container_name: nginx
        restart: unless-stopped
        ports:
            - "80:80" #http
            - "443:443" #https
        volumes:
            - .:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - api
        networks:
            - laravel

    pgsql:
        image: postgres:16-bullseye
        container_name: pgsql
        restart: always
        ports:
            - "5432:5432"
        volumes:
            - ./.docker/postgresql:/var/lib/postgresql/data
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        networks:
            - laravel

    redis:
        image: redis:alpine
        container_name: redis
        restart: unless-stopped
        networks:
            - laravel

networks:
    laravel:
        driver: bridge
