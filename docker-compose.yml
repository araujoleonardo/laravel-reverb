services:
  api:
    build:
      context: ./
      dockerfile: ./docker/Dockerfile
    image: araujoleonardo/api-dev
    container_name: api
    restart: always
    working_dir: /var/www/
    volumes:
      - ./:/var/www
    networks:
      - laravel

  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80" #http
      - "443:443" #https
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
    networks:
      - laravel

  horizon:
    build:
      context: ./
      dockerfile: ./docker/horizon/Dockerfile
    image: araujoleonardo/horizon
    container_name: horizon
    restart: always
    working_dir: /var/www/
    volumes:
      - ./:/var/www
      - ./storage:/var/www/storage
    depends_on:
      - api
      - redis
    networks:
      - laravel

  reverb:
    build:
      context: ./
      dockerfile: ./docker/reverb/Dockerfile
    image: araujoleonardo/reverb
    container_name: reverb
    restart: always
    working_dir: /var/www/
    ports:
      - "8080:8080"
    volumes:
      - ./:/var/www
      - ./storage:/var/www/storage
    depends_on:
      - api
      - redis
      - horizon
    networks:
      - laravel

  pgsql:
    image: postgres:16-bullseye
    container_name: pgsql
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - ./.docker/postgresql:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - laravel

  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    networks:
      - laravel

networks:
  laravel:
    driver: bridge
