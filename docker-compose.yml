services:
  api:
    build:
      context: ./
      dockerfile: ./docker/Dockerfile
    image: araujoleonardo/reverb_api
    container_name: api
    restart: always
    working_dir: /var/www/
    volumes:
      - ./:/var/www
      - ./storage:/var/www/storage
    ports:
      - "80:80" #http
      - "443:443" #https
      - "${REVERB_PORT:-8080}:${REVERB_PORT:-8080}" #reverb
    networks:
      - reverb

  pgsql:
    image: postgres:16-bullseye
    container_name: pgsql_rh
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - ./.docker/postgresql:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - reverb

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    networks:
      - reverb

networks:
  reverb:
    driver: bridge
