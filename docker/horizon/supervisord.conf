[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:horizon]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www
command=docker-php-entrypoint php artisan horizon
autostart=true
autorestart=true
numprocs=1
user=www-data
stopwaitsecs=3600
; Desabilita log da saída padrão
stdout_logfile=/dev/null
; Habilita apenas log de erro
stderr_logfile=/var/www/storage/logs/horizon.err.log
stderr_logfile_maxbytes=50MB

[program:schedule]
process_name=%(program_name)s
command=/bin/sh -c "while true; do docker-php-entrypoint php /var/www/artisan schedule:run; sleep 60; done"
autostart=true
autorestart=true
user=root
redirect_stderr=true
; Habilita log padrão
stdout_logfile=/var/www/storage/logs/schedule.log
stdout_logfile_maxbytes=50MB
; Habilita apenas log de erro
stderr_logfile=/var/www/storage/logs/schedule.err.log
stderr_logfile_maxbytes=50MB
