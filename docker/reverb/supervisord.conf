[supervisord]
nodaemon=true
user=root
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:reverb]
process_name=%(program_name)s
directory=/var/www
command=docker-php-entrypoint php artisan reverb:start --host=0.0.0.0 --port=8080
autostart=true
autorestart=true
user=www-data
stopwaitsecs=10
; Desabilita log da saída padrão
stdout_logfile=/dev/null
; Habilita apenas log de erro
stderr_logfile=/var/www/storage/logs/horizon.err.log
stderr_logfile_maxbytes=50MB
